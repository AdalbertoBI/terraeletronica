<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Imagem</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #f0f0f0;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            margin: 0 auto;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Teste de Carregamento da Imagem Sensory Musical</h1>
        
        <h2>Teste 1: Caminho Relativo (como na página principal)</h2>
        <img src="../assets/images/banners/sensory-musical.png" alt="Teste - Sensory Musical" style="display: block; max-width: 100%; height: auto;">
        
        <h2>Teste 2: Verificação do arquivo</h2>
        <p>Se você vê uma imagem acima, o caminho está correto. Se não vê, há um problema com o arquivo ou caminho.</p>
        
        <h2>Teste 3: Outras imagens para comparação</h2>
        <img src="../assets/images/banners/sala-de-musicoterapia.jpeg" alt="Teste - Sala de Musicoterapia" style="display: block; max-width: 100%; height: auto; margin-top: 10px;">
    </div>
</body>
</html>
